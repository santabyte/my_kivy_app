name: Build Kivy APK
on: 
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
      
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'
        
    - name: Install Buildozer dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip \
          git \
          zip \
          unzip \
          openjdk-11-jdk \
          libncurses5 \
          libstdc++6 \
          zlib1g-dev
        
    - name: Install Buildozer
      run: pip3 install buildozer cython==0.29.33
        
    - name: Initialize Buildozer
      run: buildozer init
      
    - name: Build APK
      run: |
        buildozer android debug 2>&1 | tee build.log
        
    - name: Upload APK
      uses: actions/upload-artifact@v2
      with:
        name: android-apk
        path: bin/*.apk
        
    - name: Upload build log
      uses: actions/upload-artifact@v2
      if: always()
      with:
        name: build-logs
        path: build.log
